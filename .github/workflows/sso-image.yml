name: Build SSO image

# Builds a HyperDX `prod` image with the proxy-auth (oauth2-proxy/Dex) SSO
# overlay applied onto a chosen upstream tag, and pushes it to this repo's
# GitHub Container Registry (ghcr.io/<owner>/<repo>) so the cluster can pull it.
#
# Usage: Actions tab -> "Build SSO image" -> Run workflow -> pick the upstream
# app tag that matches the ClickStack chart's appVersion (e.g. @hyperdx/app@2.39.1).

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream HyperDX app tag to build (must match chart appVersion)'
        required: true
        default: '@hyperdx/app@2.39.1'
  push:
    branches: [main]
    paths:
      - 'sso/**'
      - '.github/workflows/sso-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (with sso/ overlay)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag & version
        id: ver
        run: |
          TAG="${{ github.event.inputs.upstream_tag || '@hyperdx/app@2.39.1' }}"
          VERSION="${TAG##*@}"   # @hyperdx/app@2.39.1 -> 2.39.1
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "Building $TAG (version $VERSION)"

      - name: Integrate SSO overlay onto upstream tag
        run: ./sso/apply.sh "${{ steps.ver.outputs.tag }}" build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push prod image
        uses: docker/build-push-action@v7
        with:
          context: build
          file: build/docker/hyperdx/Dockerfile
          target: prod
          platforms: linux/amd64
          build-contexts: |
            hyperdx=build/docker/hyperdx
            api=build/packages/api
            app=build/packages/app
          build-args: |
            CODE_VERSION=${{ steps.ver.outputs.version }}-sso
          tags: |
            ghcr.io/${{ steps.img.outputs.name }}:${{ steps.ver.outputs.version }}-sso
            ghcr.io/${{ steps.img.outputs.name }}:sso-latest
          push: true
          provenance: false
