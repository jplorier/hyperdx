name: Build SSO image

# Builds the HyperDX `prod` image from this fork (upstream + packages/sso),
# then the clickstack-sso Helm chart (ClickStack + Dex) pinned to that image,
# and pushes both to this repo's GHCR:
#   ghcr.io/<owner>/<repo>:<version>-sso.<sha>          image
#   oci://ghcr.io/<owner>/charts/clickstack-sso <same>  chart
# <version> is packages/api's, i.e. the upstream release last merged in.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  meta:
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag doubles as the chart's SemVer version, where a numeric
      # identifier may not start with 0. Lengthen an all-digit short sha until
      # it has a letter.
      - name: Resolve version and tag
        id: meta
        run: |
          VERSION="$(jq -r .version packages/api/package.json)"
          LEN=7
          REV="$(git rev-parse --short=$LEN HEAD)"
          while [[ "$REV" =~ ^0[0-9]*$ ]]; do
            LEN=$((LEN + 1))
            REV="$(git rev-parse --short=$LEN HEAD)"
          done
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "version=$VERSION"
            echo "tag=$VERSION-sso.$REV"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    # Native runner per arch (the mgmt observability nodepool is arm64).
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push prod image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/hyperdx/Dockerfile
          target: prod
          platforms: linux/${{ matrix.arch }}
          build-contexts: |
            hyperdx=docker/hyperdx
            api=packages/api
            app=packages/app
          build-args: |
            CODE_VERSION=${{ needs.meta.outputs.tag }}
          tags:
            ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.tag }}-${{
            matrix.arch }}
          push: true
          provenance: false

  manifest:
    needs: [meta, build]
    runs-on: ubuntu-26.04
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # <version>-sso.<sha> is immutable, so IfNotPresent nodes never reuse a
      # stale cached image; <version>-sso and sso-latest move with main.
      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:$VERSION-sso" \
            -t "$IMAGE:sso-latest" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG"

  chart:
    needs: [meta, manifest]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Package chart pinned to the image
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          TAG: ${{ needs.meta.outputs.tag }}
        working-directory: charts/clickstack-sso
        run: |
          # Exactly one placeholder: the HyperDX image tag.
          [ "$(grep -c '0.0.0-dev' values.yaml)" = 1 ] || { echo "expected one image tag placeholder"; exit 1; }
          sed -i "s|repository: ghcr.io/jplorier/hyperdx|repository: $IMAGE|; s|0.0.0-dev|$TAG|" values.yaml
          helm dependency build .
          helm lint . \
            --set global.sso.host=lint.example.com \
            --set global.sso.oidcClientSecret=lint \
            --set 'global.sso.allowedGroups={lint}' \
            --set sso.github.clientID=lint \
            --set sso.github.clientSecret=lint \
            --set 'sso.github.orgs[0].name=lint'
          helm package . --version "$TAG" --app-version "$TAG" -d "$RUNNER_TEMP"

      - name: Push chart
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/clickstack-sso-$TAG.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
