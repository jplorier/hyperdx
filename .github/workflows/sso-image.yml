name: Build SSO image

# Builds a HyperDX `prod` image with the proxy-auth (oauth2-proxy/Dex) SSO
# overlay applied onto a chosen upstream tag, and pushes it to this repo's
# GitHub Container Registry (ghcr.io/<owner>/<repo>) so the cluster can pull it.
#
# Usage: Actions tab -> "Build SSO image" -> Run workflow -> pick the upstream
# app tag that matches the ClickStack chart's appVersion (e.g. @hyperdx/app@2.42.0).

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream HyperDX app tag to build (must match chart appVersion)'
        required: true
        default: '@hyperdx/app@2.42.0'
  push:
    branches: [main]
    paths:
      - 'sso/**'
      - '.github/workflows/sso-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Native runner per arch (the mgmt observability nodepool is arm64).
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout fork (with sso/ overlay)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve tag & version
        id: ver
        # Inputs reach the script through env, never ${{ }} interpolation,
        # so a crafted tag cannot inject shell.
        env:
          TAG: ${{ inputs.upstream_tag || '@hyperdx/app@2.42.0' }}
        run: |
          [[ "$TAG" =~ ^@hyperdx/app@[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid tag: $TAG"; exit 1; }
          VERSION="${TAG##*@}"   # @hyperdx/app@2.42.0 -> 2.42.0
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "Building $TAG (version $VERSION)"

      - name: Integrate SSO overlay onto upstream tag
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: ./sso/apply.sh "$TAG" build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push prod image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build
          file: build/docker/hyperdx/Dockerfile
          target: prod
          platforms: linux/${{ matrix.arch }}
          build-contexts: |
            hyperdx=build/docker/hyperdx
            api=build/packages/api
            app=build/packages/app
          build-args: |
            CODE_VERSION=${{ steps.ver.outputs.version }}-sso
          tags: ghcr.io/${{ steps.img.outputs.name }}:${{ steps.ver.outputs.version }}-sso-${{ matrix.arch }}
          push: true
          provenance: false

  manifest:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Also tag <ver>-sso.<sha>: immutable, so IfNotPresent nodes never reuse a
      # stale cached image after a rebuild of the same upstream version.
      - name: Create multi-arch manifest
        env:
          TAG: ${{ inputs.upstream_tag || '@hyperdx/app@2.42.0' }}
        run: |
          [[ "$TAG" =~ ^@hyperdx/app@[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid tag: $TAG"; exit 1; }
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SRC="${IMAGE}:${TAG##*@}-sso"
          docker buildx imagetools create \
            -t "${SRC}" \
            -t "${SRC}.${GITHUB_SHA::7}" \
            -t "${IMAGE}:sso-latest" \
            "${SRC}-amd64" \
            "${SRC}-arm64"
          docker buildx imagetools inspect "${SRC}"
