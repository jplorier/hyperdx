apiVersion: v2
name: clickstack-sso
description: >-
  ClickStack running the fork's SSO HyperDX image, with Dex as its OIDC
  provider for GitHub and Google sign-in.
type: application
# CI overwrites version, appVersion and the HyperDX image tag with
# <api version>-sso.<sha>, so chart and image versions always match.
version: 0.0.0-dev
appVersion: 0.0.0-dev
dependencies:
  - name: clickstack
    version: 3.4.0
    repository: https://clickhouse.github.io/ClickStack-helm-charts
  - name: dex
    version: 0.26.0
    repository: https://charts.dexidp.io
