{{- with .Values.sso.google }}
{{- if and .enabled .serviceAccountJSON }}
apiVersion: v1
kind: Secret
metadata:
  name: dex-google-sa
  labels:
    app.kubernetes.io/part-of: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
type: Opaque
stringData:
  sa.json: {{ .serviceAccountJSON | quote }}
{{- end }}
{{- end }}
